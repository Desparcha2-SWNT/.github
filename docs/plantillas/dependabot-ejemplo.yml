# Ejemplo de .github/dependabot.yml para los repositorios de Festa.
# Copia solo los bloques de los ecosistemas que use el repositorio y bórralos del resto.
#
#   festa-mobile          -> pub (Flutter) + github-actions
#   festa-auth-service    -> maven + github-actions
#   festa-user-service    -> maven + github-actions
#   festa-event-service   -> npm + github-actions
#   festa-gateway         -> docker + github-actions
#   festa-infra           -> terraform + docker + github-actions
#
# Los PR de Dependabot pasan por el mismo CI y necesitan la aprobación de otra persona.
version: 2
updates:
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly

  - package-ecosystem: maven
    directory: /
    schedule:
      interval: weekly
    open-pull-requests-limit: 5

  - package-ecosystem: npm
    directory: /
    schedule:
      interval: weekly
    open-pull-requests-limit: 5

  - package-ecosystem: pub
    directory: /
    schedule:
      interval: weekly

  - package-ecosystem: docker
    directory: /
    schedule:
      interval: weekly

  - package-ecosystem: terraform
    directory: /terraform/aws-lab
    schedule:
      interval: weekly
