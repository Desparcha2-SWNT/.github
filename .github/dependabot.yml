# Dependabot de este repositorio (.github): solo tiene workflows de GitHub Actions.
# Cada repositorio de Festa necesita su propio dependabot.yml con su ecosistema;
# hay un ejemplo en docs/plantillas/dependabot-ejemplo.yml.
version: 2
updates:
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
    commit-message:
      prefix: "chore(deps)"
    labels:
      - dependencias
